[project]
name = "terrapilot-workspace"
version = "0.1.0"
description = "TerraPilot workspace root: intelligent operator companion for heavy equipment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["terrapilot"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
terrapilot = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
]
notebook = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]
extend-exclude = ["apps", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913", # many args are normal for generators
    "PLR0915",
    "PLR0912",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLC0415", # lazy imports keep CLI startup fast
    "E501",    # line length is enforced by `ruff format`; it cannot split long strings/SQL
]

# §2.1: magic-value comparisons (PLR2004) are enforced only in the safety and analytics packages.
[tool.ruff.lint.per-file-ignores]
"!backend/terrapilot/{safety,analytics}/**" = ["PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "terrapilot.api.deps.require_roles"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["backend/terrapilot"]

[[tool.mypy.overrides]]
module = ["terrapilot.domain.*", "terrapilot.safety.*", "terrapilot.twin.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "postgres: needs a running Postgres (docker compose up postgres)",
    "live_groq: hits the real Groq API (needs GROQ_API_KEY)",
]
