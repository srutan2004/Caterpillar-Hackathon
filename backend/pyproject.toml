[project]
name = "terrapilot"
version = "0.1.0"
description = "TerraPilot backend: config system, API, LLM gateway, synthetic data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.13",
    "rich>=13.9",
    "structlog>=24.4",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "simpleeval>=1.0",
    "pyjwt>=2.10",
    "groq>=0.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "redis>=5.2",
    "python-multipart>=0.0.17",
    # Phase 2/3: ML, optimisation, retrieval, agent graph, SQL safety
    "lightgbm>=4.5",
    "lifelines>=0.29",
    "pulp>=2.9",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "sqlglot>=25.0",
    "langgraph>=0.2",
    "pillow>=11.0",
]

[project.scripts]
tp = "terrapilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrapilot"]
