name: nightly-llm

# The only workflow that talks to Groq: catches retired/renamed model IDs early (§4.1, §15).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  llm-check:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TP_ENV: test
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run tp llm-check
