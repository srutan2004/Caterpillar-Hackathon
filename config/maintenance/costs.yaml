  cooling: {inspect: 0.5, minor: 2, major: 6}
  electrical: {inspect: 0.8, minor: 2, major: 6}
  battery: {inspect: 1.0, minor: 4, major: 16}
  transmission: {inspect: 1.0, minor: 5, major: 20}
  brakes: {inspect: 0.8, minor: 3, major: 8}
  tyres: {inspect: 0.3, minor: 1.5, major: 3}
