# Repair and wear cost parameters (§10.15.2, §10.15.4). Currency from app.costs.currency.
labour_rate_per_h: {technician: 1400, senior_technician: 2100, dealer_field_service: 3500}
site_remoteness_travel_h: {site_north: 1.5, site_quarry: 2.5, site_metro: 0.5}
downtime_cost_per_h_by_class: {excavator: 6500, wheel_loader: 5000, adt: 5500}
maintenance_accrual_per_h:
