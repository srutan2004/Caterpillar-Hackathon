  wheel_loader: {engine: 50, hydraulic_pump: 30, transmission: 35, brakes: 15, tyres: 85, axles: 20, bucket_linkage: 15, articulation: 10, dpf: 12, cooling: 10, electrical: 8}
  adt: {engine: 60, transmission: 45, brakes: 20, tyres: 120, axles: 25, articulation: 12, dump_body: 15, dpf: 12, cooling: 10, electrical: 8}
get_wear:
