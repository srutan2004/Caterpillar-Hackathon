- code: TRN-TEMP-01
  component: transmission
  severity: service_soon
  classes: [wheel_loader, adt]
  title_key: fault.trn_temp_01
  description: Transmission oil temperature above service limit.
  probable_causes: [cooler restriction, clutch slip, low oil]
  checks: [check oil level, inspect cooler, review gear-hunting]
  safe_to_continue: "limited"
  manual_ref: {section: troubleshooting, procedure_id: TRN-TEMP-01}
