  manual_ref: {section: troubleshooting, procedure_id: BAT-CELL-01}
  part_numbers: [BM-MOD-48]
- code: BAT-ISO-01
  component: electrical
  severity: stop
  classes: [excavator]
  title_key: fault.bat_iso_01
  description: High-voltage insulation resistance low.
  probable_causes: [moisture ingress, damaged HV cable]
