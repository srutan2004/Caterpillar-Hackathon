- code: TYR-LEAK-01
  component: tyres
  severity: service_soon
  classes: [wheel_loader, adt]
  title_key: fault.tyr_leak_01
  description: Tyre pressure falling steadily (slow leak).
  probable_causes: [puncture, valve stem leak, rim seal damage]
