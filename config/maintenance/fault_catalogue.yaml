- code: BRK-TEMP-01
  component: brakes
  severity: stop
  classes: [wheel_loader, adt]
  title_key: fault.brk_temp_01
  description: Service brake temperature critical.
  probable_causes: [dragging brake, excessive downhill braking without retarder]
